[package]
name = "search-rerank"
version = "0.1.0"
edition = "2021"
description = "Compare jev-search rerank providers: Qwen3-Reranker vs laya_ft noul vs BM25"
license = "MIT"
publish = false

[[bin]]
name = "search-rerank"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
regex-lite = "0.1"
anyhow = "1"
