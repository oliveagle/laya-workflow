name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: lint + tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (locked)
        run: cargo build --locked --bins -p laya-workflow

      # Reports formatting drift but does not gate: the runner's rustfmt may
      # be newer than the version used at commit time.
      - name: rustfmt (report only)
        run: cargo fmt --all -- --check || echo "::warning::cargo fmt check failed" 

      # Reports but does not gate: the codebase currently has ~20 pre-existing
      # clippy warnings; make them visible without blocking CI.
      - name: Clippy (report only)
        run: cargo clippy --locked --bins -p laya-workflow --no-deps -- --cap-lints warn

      # Offline suite: LAYA_MOCK_URL / LAYA_MOCK3 / LAYA_WEB_PORT are
      # deliberately unset, so the network-dependent sections skip instead of
      # hanging (they wait on listeners that never come up).
      - name: Tests (offline harness)
        run: ./target/debug/laya-workflow-tests

      # bdd/features/*.feature is hand-written; every spec under it is
      # generated. Catches a step that stopped parsing, or a scenario that
      # compiles to a spec the engine rejects. Deliberately Chrome-free - the
      # CDP run in scripts/bdd/run.py is the local gate, because this runner
      # installs no browser.
      - name: BDD documents compile and validate
        run: ./scripts/bdd/check.sh ./target/debug/laya-workflow

      # scripts/verify.sh is not what CI runs, so anything that must hold in
      # CI needs its own step. The registry is the table that says which
      # plugins ship; it had drifted from plugins/ in both directions.
      - name: Bundled plugins are in the registry
        run: python3 ./scripts/plugin_registry_check.py

  integration:
    name: tests + DSL smoke (mock services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYA_TEST_PYTHON: python3
      LAYA_MOCK_URL: http://127.0.0.1:8791
      LAYA_WEB_PORT: "8793"
      LAYA_MOCK3: 127.0.0.1:6380:4223:1884:2526:9000:9091:8083:9999
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (locked, release)
        run: cargo build --release --locked --bins -p laya-workflow

      - name: Start mock services (protocols + web)
        run: bench/mock_services.sh start

      - name: Start mock servers (8791 score/agent + 8792 rpc/agent)
        run: |
          for PORT in 8791 8792; do
            python3 bench/mock_server.py --port "$PORT" > /tmp/mock_server_$PORT.log 2>&1 &
          done
          for PORT in 8791 8792; do
            for i in $(seq 1 40); do
              curl -sf -o /dev/null -X POST -H 'content-type: application/json' \
                -d '{"text":"ping"}' "http://127.0.0.1:$PORT/score" && break
              sleep 0.25
            done
            curl -sf -o /dev/null -X POST -H 'content-type: application/json' \
              -d '{"text":"ping"}' "http://127.0.0.1:$PORT/score" || {
                echo "mock_server $PORT did not become ready" >&2
                cat /tmp/mock_server_$PORT.log >&2 || true
                exit 1
              }
          done
          echo "mock servers 8791+8792 ready"

      - name: Tests (mocked harness)
        run: ./target/release/laya-workflow-tests

      - name: DSL smoke (mocked backend)
        run: python3 bench/dsl_smoke.py

      - name: CLI smoke (offline backend)
        run: |
          ./target/release/laya-workflow validate --spec dsl/routing/support_ticket_router.json
          ./target/release/laya-workflow apps

      - name: Stop mock services
        if: always()
        run: bench/mock_services.sh stop || true
