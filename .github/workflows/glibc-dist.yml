name: glibc-dist

# A linux binary for hosts whose glibc is older than the runner's.
#
# `release.yml` builds on `ubuntu-latest`, so its x86_64 binary needs
# GLIBC_2.35/2.39 — it will not start on a RHEL 9 box (glibc 2.34) or anything
# older. The QA hosts that actually run Laya ship a separate
# `laya-workflow-<ver>-glibc216-x86_64.tar.gz` for exactly that reason, and it
# used to be produced by hand on a Mac (`cargo zigbuild
# --target x86_64-unknown-linux-gnu.2.16`). This workflow makes that build a
# first-class release artifact instead.
#
# Trigger it for a tag that is already released (the tag must still be pushed
# first; the release is created by `release.yml`):
#
#   gh workflow run glibc-dist.yml -f tag=v0.12.0
#
# The job asserts the symbol ceiling it advertises: if the result needs
# anything above GLIBC_2.16 the job fails rather than shipping a binary that
# only *looks* old.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g. v0.12.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  glibc216:
    name: linux x86_64 (glibc <= 2.16)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag to build
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in v*) ;; *) echo "::error::tag must start with v (got '$TAG')"; exit 1 ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PKG_VER=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc216-x86_64-linux-gnu

      - name: Install zig
        run: |
          ZIG_VERSION=0.13.0
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "/opt/zig-linux-x86_64-${ZIG_VERSION}/zig" version

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      # The `.2.16` suffix is cargo-zigbuild's glibc baseline: zig links against
      # that version's stubs, so the ELF only references symbols up to it.
      - name: Build (low-glibc)
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.16 -p laya-workflow

      - name: Assert the glibc ceiling
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/laya-workflow
          file "$BIN"
          objdump -T "$BIN" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | sed 's/^/  needs /' | tail -5
          bad=$(objdump -T "$BIN" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | awk -F. '$2 >= 17' | head -1)
          if [ -n "$bad" ]; then
            echo "::error::$BIN requires $bad but this artifact advertises glibc <= 2.16"
            exit 1
          fi
          echo "ok: everything is GLIBC_2.16 or older"

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/laya-workflow-${PKG_VER}-glibc216-x86_64.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release laya-workflow
          ls -la dist/
          sha256sum dist/*.tar.gz

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.tar.gz
          # An `-rc.N` tag is a candidate, not the release — keep it a prerelease
          # so `update`'s /releases/latest keeps pointing at the formal version.
          prerelease: ${{ contains(env.TAG, '-rc') }}
