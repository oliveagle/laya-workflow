name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl   # OpenWrt / 嵌入式 Linux (纯 rustls, 无 C 依赖)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild (musl target needs a cross C linker)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binaries
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p laya-workflow
          else
            cargo build --release --locked --target ${{ matrix.target }} -p laya-workflow
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          # Windows targets produce .exe binaries; unix targets don't.
          EXT=""
          case "${{ matrix.target }}" in *windows*) EXT=".exe" ;; esac
          BIN="target/${{ matrix.target }}/release/laya-workflow${EXT}"
          TESTS="target/${{ matrix.target }}/release/laya-workflow-tests${EXT}"
          # Production tarball: the runtime CLI only. The test harness is
          # dev-only and must not land on every machine that grabs a release.
          tar -czf "dist/laya-workflow-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          # Dev-only tarball: the offline regression harness, for developers.
          tar -czf "dist/laya-workflow-dev-${{ matrix.target }}.tar.gz" -C "$(dirname "$TESTS")" "$(basename "$TESTS")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laya-workflow-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          # An `-rc.N` tag is a release candidate, not the release: mark it so.
          # A prerelease cannot become "latest", so `update`'s /releases/latest
          # keeps pointing at the last formal version and no one is auto-upgraded
          # onto an rc.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
