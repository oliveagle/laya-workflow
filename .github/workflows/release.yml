name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p laya-workflow

      - name: Package (unix)
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/laya-workflow"
          TESTS="target/${{ matrix.target }}/release/laya-workflow-tests"
          # Production tarball: the runtime CLI only. The test harness is
          # dev-only and must not land on every machine that grabs a release.
          tar -czf "dist/laya-workflow-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" laya-workflow
          # Dev-only tarball: the offline regression harness, for developers.
          tar -czf "dist/laya-workflow-dev-${{ matrix.target }}.tar.gz" -C "$(dirname "$TESTS")" laya-workflow-tests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laya-workflow-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
