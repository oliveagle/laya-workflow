[workspace]
members = [".", "laya-tch"]
resolver = "2"

[package]
name = "laya-workflow"
version = "0.1.0"
edition = "2021"
description = "Laya workflow engine — validate / run / optimize decision-graph workflows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ureq = { version = "2", features = ["json"] }
regex-lite = "0.1"

[[bin]]
name = "laya-workflow"
path = "src/workflow_cli.rs"

[[bin]]
name = "laya-workflow-tests"
path = "src/workflow_tests/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
